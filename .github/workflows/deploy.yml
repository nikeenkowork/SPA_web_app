# Название рабочего процесса GitHub Actions.
name: Django CI/CD

# События, запускающие workflow.
on:
  push:
    branches:
      - homework/docker-compose

  pull_request:
    branches:
      - develop

# Права доступа workflow.
permissions:
  contents: read

jobs:
  # Проверка Python-кода и запуск Django-тестов.
  test:
    name: Run tests and linting
    runs-on: ubuntu-24.04

    # Вспомогательные сервисы.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379

    steps:
      # Получение исходного кода.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Установка Python.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry

      # Установка Poetry.
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      # Установка зависимостей проекта.
      - name: Install dependencies
        run: poetry install --with dev --no-root

      # Проверка форматирования.
      - name: Run Black
        run: poetry run black --check .

      # Установка Flake8.
      - name: Install Flake8
        run: python -m pip install flake8

      # Проверка качества Python-кода.
      - name: Run Flake8
        run: flake8 .

      # Запуск Django-тестов.
      - name: Run Django tests
        env:
          SECRET_KEY: ci-only-test-secret
          STRIPE_SECRET_KEY: sk_test_placeholder
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1

          # PostgreSQL.
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"

          # Redis.
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_DB: "0"

          # Celery.
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0

        run: poetry run python manage.py test

  # Проверка Docker Compose и сборка образов.
  docker-build:
    name: Validate Docker build
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Создание файла окружения для Docker Compose.
      - name: Create empty environment file
        run: touch .env

      # Проверка конфигурации Docker Compose.
      - name: Validate Docker Compose
        run: docker compose config --quiet

      # Сборка Docker-образов.
      - name: Build Docker images
        run: docker compose build

  # Развёртывание приложения на Hetzner.
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-24.04

    needs:
      - test
      - docker-build

    # Деплой только после push в рабочую ветку.
    if: github.event_name == 'push' && github.ref == 'refs/heads/homework/docker-compose'

    steps:
      # Настройка SSH.
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # Добавление сервера в known_hosts.
      - name: Trust Remote Host
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # Развёртывание приложения.
      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
            # Прекращение выполнения при ошибке.
            set -e

            # Переход в директорию приложения.
            cd /home/deploy/SPA_web_app

            # Получение последних изменений.
            git fetch origin homework/docker-compose

            # Обновление рабочей копии.
            git reset --hard origin/homework/docker-compose

            # Сборка Docker-образов.
            docker compose build

            # Выполнение миграций Django.
            docker compose run --rm web python manage.py migrate --noinput

            # Запуск приложения.
            docker compose up -d --remove-orphans

            # Очистка неиспользуемых образов.
            docker image prune -f
          REMOTE
